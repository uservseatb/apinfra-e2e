version: "3"

vars:
  APINFRA_DIR: '{{.APINFRA_DIR | default "../apinfra"}}'
  BINARY_NAME: apinfra

tasks:
  fmt:
    desc: Format Go sources
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  sync:
    desc: Cross-compile Linux apinfra into bin/ (+ copy product README)
    cmds:
      - |
        set -euo pipefail
        case "$(uname -m)" in
          x86_64) ARCH="${ARCH:-amd64}" ;;
          aarch64|arm64) ARCH="${ARCH:-arm64}" ;;
          *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
        esac
        (cd "{{.APINFRA_DIR}}" && GOOS=linux GOARCH="${ARCH}" CGO_ENABLED=0 task build)
        mkdir -p bin
        cp "{{.APINFRA_DIR}}/bin/{{.BINARY_NAME}}" "bin/{{.BINARY_NAME}}"
        cp "{{.APINFRA_DIR}}/README.md" README.md
        if [ -f e2e-scenarios.md ]; then
          printf '\n' >> README.md
          cat e2e-scenarios.md >> README.md
        fi

  e2e:
    desc: Run e2e tests in privileged Ubuntu DinD (isolates host :80/:443)
    deps: [sync]
    cmds:
      - bash ./run.sh

  test:
    desc: Alias for e2e (DinD)
    cmds:
      - task: e2e

  check:
    desc: fmt + vet + e2e
    deps: [fmt, vet]
    cmds:
      - task: e2e

  default:
    desc: Default task
    cmds:
      - task: e2e
