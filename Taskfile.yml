version: "3"

tasks:
  fmt:
    desc: Format Go sources
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  e2e:
    desc: Run e2e tests in privileged Ubuntu DinD (isolates host :80/:443)
    cmds:
      - bash ./env/run.sh

  test:
    desc: Alias for e2e (DinD)
    cmds:
      - task: e2e

  check:
    desc: fmt + vet + e2e
    deps: [fmt, vet]
    cmds:
      - task: e2e

  default:
    desc: Default task
    cmds:
      - task: e2e
