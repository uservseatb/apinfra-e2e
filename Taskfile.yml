version: "3"

tasks:
  fmt:
    desc: Format Go sources
    cmds:
      - go fmt ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  e2e:
    desc: "Run e2e in DinD. After --: theme (docker|certs|…) or scenario (cycle/happy_path)"
    cmds:
      - bash ./env/run.sh {{.CLI_ARGS}}

  default:
    desc: Default task (e2e)
    cmds:
      - task: e2e
        vars:
          CLI_ARGS: "{{.CLI_ARGS}}"
